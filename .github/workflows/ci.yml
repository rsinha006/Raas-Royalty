name: CI

# Item 19. The tests were run by hand until now, which is fine until the week
# where every change is made under pressure by someone who is also carrying a
# radio. Runs on every push and every pull request.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      # One version, and it is the one that deploys: the Dockerfile pins
      # node:22-bookworm-slim, and `engines` is now `>=22` to match.
      #
      # Node 20 was dropped 2026-08-13 along with the test-discovery script it
      # forced: no single `node --test` argument is recursive on both 20 and
      # 22+, so supporting the older floor meant either a wrapper or a
      # non-recursive pattern. See docs/decisions.md.
      #
      # ⚠️ The floor in `engines` is only as true as this matrix. If it is
      # widened again, widen this too — a floor nothing runs is a claim, and
      # this project has already shipped one: `>=20` held for weeks while the
      # Node 20 leg was running zero tests.
      fail-fast: false
      matrix:
        node: ['22']

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            client/package-lock.json

      # The root postinstall installs the client too.
      - run: npm ci

      # `tsc --noEmit && vite build`. The build is here for the typecheck and
      # because the service-worker manifest is generated from the real bundle —
      # a client that does not build is a shell that does not update.
      - run: npm run build

      - run: npm test
        env:
          # The tests each use a throwaway database, but the server refuses to
          # boot on an unresolvable zone and CI machines are UTC.
          EVENT_TIMEZONE: America/Indiana/Indianapolis
